<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>To Do</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a todo..." required autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
